name: Quality checks

on:
    push:
        branches:
            - 'main'
    pull_request:
        branches:
            - 'main'
    workflow_dispatch:

jobs:
    eslint:
        runs-on: ubuntu-latest

        steps:
            - name: Check Out Repo
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

    tests:
        runs-on: ubuntu-latest
        services:
            mongodb:
                image: mongo:6
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'" --health-interval 10s --health-timeout 5s --health-retries 5

        steps:
            - name: Check Out Repo
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm test

            - name: Run integration tests
              run: npm run test:integration
              env:
                  TEST_MONGO_URI: mongodb://127.0.0.1:27017/trip2guide-test
